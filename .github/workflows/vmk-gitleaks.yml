# vMK Gitleaks Scan — Secret detection for vMK-dev
# Triggers: push/PR to vMK-dev, manual dispatch, weekly schedule
#
# vMK: Fork-specific secrets scan. .gitleaksignore already exists
# with known false-positives from http-recorder redaction tests.

name: vmk-gitleaks

on:
  push:
    branches: [vMK-dev]
  pull_request:
    branches: [vMK-dev]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
