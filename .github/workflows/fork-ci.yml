name: fork-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Check noUncheckedIndexedAccess overrides
        run: |
          errors=0
          for pkg in core llm effect-drizzle-sqlite; do
            file="packages/$pkg/tsconfig.json"
            if [ -f "$file" ] && grep -q '"noUncheckedIndexedAccess": false' "$file"; then
              echo "::error file=$file::noUncheckedIndexedAccess must not be false in $pkg (remove override)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then exit 1; fi
        shell: bash
      - run: bun typecheck

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Run unit tests
        timeout-minutes: 20
        run: bun turbo test --output-logs=errors-only --log-order=grouped --log-prefix=task
